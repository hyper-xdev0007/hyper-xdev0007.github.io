<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop 2048 - GameZone</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .game-page { min-height: calc(100vh - 64px); padding: 28px 16px 48px; text-align: center; overflow:hidden; font-family:'Trebuchet MS','Arial Rounded MT Bold',Arial,sans-serif; background: radial-gradient(circle at 15% 10%, #3655ab 0, transparent 25%), radial-gradient(circle at 84% 25%, #702c8b 0, transparent 24%), linear-gradient(145deg, #151c43 0%, #0c1025 55%, #111330 100%); background-size:130% 130%; animation:aurora 12s ease-in-out infinite alternate; }
        .game-page::before { content:""; position:fixed; inset:64px 0 0; pointer-events:none; opacity:.18; background-image:linear-gradient(rgba(137,211,255,.23) 1px, transparent 1px),linear-gradient(90deg, rgba(137,211,255,.23) 1px, transparent 1px); background-size:34px 34px; mask-image:linear-gradient(to bottom, #000, transparent 68%); }
        .back-link { position:relative; display: inline-block; color: #b8f4ff; margin-bottom: 20px; font-weight: 700; font-size:.9rem; transition:transform .2s,color .2s; }
        .back-link:hover { transform:translateX(-4px); color:#fff; }
        .game-shell { position:relative; width: min(100%, 420px); margin: auto; padding:18px; border:1px solid rgba(170,229,255,.2); border-radius:28px; background:linear-gradient(145deg,rgba(38,53,108,.54),rgba(14,17,45,.72)); box-shadow:0 24px 60px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.1); backdrop-filter:blur(10px); animation:panel-in .55s cubic-bezier(.2,.8,.25,1) both; }
        .game-heading { display:flex; align-items:end; justify-content:space-between; text-align:left; margin-bottom:16px; }
        .game-heading h1 { font-family:Impact,'Arial Black','Trebuchet MS',sans-serif; font-size:clamp(2rem, 8vw, 3rem); line-height:1; letter-spacing:1px; background:linear-gradient(100deg,#fff 15%,#82eaff 40%,#fff 52%,#af8dff 72%,#fff 90%); background-size:220% auto; -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; animation:title-shine 4s linear infinite, title-float 3s ease-in-out infinite; }
        .game-heading p { color:#c8cce0; margin-top:7px; font-size:.92rem; }
        .score-row { display:flex; gap:9px; }
        .score-card { min-width:74px; padding:7px 10px; border:1px solid rgba(145,225,255,.19); border-radius:11px; background:linear-gradient(150deg,#374674,#202744); color:#aeb6d8; font-size:.66rem; font-weight:bold; letter-spacing:.08em; text-align:center; box-shadow:inset 0 1px rgba(255,255,255,.12),0 5px 12px rgba(0,0,0,.12); }
        .score-card span { display:block; color:#fff; font-family:Impact,'Arial Black',sans-serif; font-size:1.3rem; letter-spacing:.5px; margin-top:2px; text-shadow:0 2px 8px rgba(88,215,255,.4); animation:score-glow 2.4s ease-in-out infinite; }
        #game-board { position:relative; aspect-ratio:4/7; width:min(100%, 300px); margin-inline:auto; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(7, 1fr); gap:7px; padding:8px; border:2px solid rgba(158,232,255,.38); border-radius:22px; background:linear-gradient(145deg,#151b3c,#0d1129); box-shadow:0 22px 44px rgba(0,0,0,.4), 0 0 30px rgba(64,188,255,.12), inset 0 0 25px rgba(81,144,255,.15); touch-action:none; user-select:none; overflow:hidden; }
        .tile { display:flex; align-items:center; justify-content:center; border-radius:12px; background:linear-gradient(145deg,#30385d,#202743); color:#fff; font-size:clamp(1.2rem, 7vw, 2rem); font-weight:800; box-shadow:inset 0 2px rgba(255,255,255,.08),inset 0 -4px rgba(0,0,0,.17),0 3px 5px rgba(0,0,0,.14); }
        .falling-tile { position:absolute; z-index:2; display:flex; align-items:center; justify-content:center; border-radius:12px; color:#fff; font-size:clamp(1.2rem, 7vw, 2rem); font-weight:800; box-shadow:inset 0 2px rgba(255,255,255,.34),inset 0 -4px rgba(0,0,0,.18),0 0 18px rgba(255,255,255,.18); outline:2px solid rgba(255,255,255,.68); outline-offset:-2px; transition:transform .42s cubic-bezier(.22,.8,.3,1); will-change:transform; }
        .tile.just-merged { animation: pop .23s ease-out; }
        .board-shake { animation:shake .3s ease-in-out; }
        @keyframes fall-in { from { transform:translateY(-110%); opacity:0; } to { transform:translateY(0); opacity:1; } }
        @keyframes pop { 50% { transform:scale(1.14); filter:brightness(1.25); } }
        @keyframes shake { 20%,60% { transform:translateX(-7px); } 40%,80% { transform:translateX(7px); } }
        @keyframes aurora { from { background-position:0% 20%; } to { background-position:100% 80%; } }
        @keyframes panel-in { from { opacity:0; transform:translateY(18px) scale(.97); } to { opacity:1; transform:none; } }
        @keyframes title-shine { to { background-position:220% center; } }
        @keyframes title-float { 50% { transform:translateY(-3px); } }
        @keyframes score-glow { 50% { text-shadow:0 0 13px rgba(109,231,255,.9); } }
        .controls { display:flex; gap:10px; margin-top:14px; }
        .game-btn { flex:1; border:1px solid rgba(180,226,255,.14); border-radius:12px; padding:12px 9px; font:700 .9rem 'Segoe UI',Arial,sans-serif; cursor:pointer; color:#fff; background:linear-gradient(145deg,#394367,#242b4d); box-shadow:inset 0 1px rgba(255,255,255,.12),0 5px 12px rgba(0,0,0,.16); transition:transform .15s,filter .15s; }
        .game-btn:hover { transform:translateY(-2px); filter:brightness(1.15); }
        .game-btn:active { transform:translateY(1px); }
        .game-btn.primary { background:linear-gradient(135deg,#46e5f4,#6280ff); color:#091326; box-shadow:0 7px 18px rgba(59,192,255,.27),inset 0 1px rgba(255,255,255,.45); }
        .game-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }
        #instructions { color:#b7bfd9; font-size:.85rem; line-height:1.5; margin:15px auto 0; max-width:340px; }
        .modal { position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(4,7,20,.72); backdrop-filter:blur(7px); }
        .modal[hidden] { display:none; }
        .modal-card { width:min(100%,360px); padding:30px 24px 24px; border:1px solid rgba(142,220,255,.35); border-radius:22px; background:linear-gradient(150deg,#29355f,#151a35); box-shadow:0 20px 55px rgba(0,0,0,.45); }
        .modal-icon { font-size:3.3rem; }
        .modal h2 { margin:7px 0; font-size:2rem; }
        .modal p { color:#d1d6e9; margin-bottom:20px; }
        .modal-actions { display:flex; gap:10px; }
        @media (max-width:600px) { .main-header { padding:14px 20px; } .nav-links { display:none; } .game-page { padding-top:22px; } .game-shell { padding:14px; border-radius:22px; } }
        @media (max-height:720px) { .main-header { padding:8px 20px; } .game-page { padding:10px 16px 16px; } .back-link { margin-bottom:8px; } .game-heading { margin-bottom:8px; } .game-heading p { display:none; } #game-board { width:min(100%, 235px); } .controls { margin-top:8px; } .game-btn { padding:9px 7px; } #instructions { margin-top:8px; font-size:.76rem; } }
        @media (prefers-reduced-motion:reduce) { .game-page, .game-shell, .game-heading h1, .score-card span { animation:none; } }
    </style>
</head>
<body>
    <header class="main-header"><div class="logo">🎮 <span>GameZone</span></div><nav class="nav-links"><ul><li><a href="../index.html">Home</a></li></ul></nav></header>
    <main class="game-page">
        <a href="../index.html" class="back-link">← Back to Home</a>
        <section class="game-shell" aria-label="Drop 2048 game">
            <div class="game-heading"><div><h1>DROP 2048</h1><p>Stack, merge, and reach 2048.</p></div><div class="score-row"><div class="score-card">SCORE<span id="score">0</span></div><div class="score-card">BEST<span id="best-score">0</span></div></div></div>
            <div id="game-board" role="application" aria-label="Game board"></div>
            <div class="controls"><button class="game-btn" id="undo-btn" disabled>↶ Undo</button><button class="game-btn" id="restart-btn">↻ Restart</button><button class="game-btn primary" id="drop-btn">↓ Drop</button></div>
            <p id="instructions">Use ← → to choose a column, then ↓ / Space to drop. On mobile: swipe left/right or swipe down to drop.</p>
        </section>
    </main>
    <div class="modal" id="start-modal"><div class="modal-card"><div class="modal-icon">✨</div><h2>Ready to merge?</h2><p>Drop equal numbers on each other to combine them. Make 2048!</p><button class="game-btn primary" id="start-btn">Start Game</button></div></div>
    <div class="modal" id="status-modal" hidden><div class="modal-card"><div class="modal-icon" id="status-icon">🏆</div><h2 id="status-title">You win!</h2><p id="status-message"></p><div class="modal-actions"><button class="game-btn" id="modal-secondary">Continue</button><button class="game-btn primary" id="modal-restart">Play again</button></div></div></div>
    <script src="../js/game2048.js"></script>
</body>
</html>
