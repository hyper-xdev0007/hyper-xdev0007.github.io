<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - NovaPlay</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
    body {
        overflow: hidden;
    }
    .game-page {
        text-align: center;
        padding: 10px;
    }
    .back-link {
        display: inline-block;
        margin-bottom: 10px;
        color: #00d4ff;
    }
    .game-frame {
        width: 100%;
        max-width: 800px;
        height: 60vh;
        border: none;
        border-radius: 15px;
        margin: 0 auto;
        display: block;
    }

    @media (max-width: 600px) {
        .game-page {
            padding: 5px;
        }
        .game-page h1 {
            font-size: 20px;
            margin: 5px 0;
        }
        .back-link {
            font-size: 14px;
            margin-bottom: 5px;
        }
        .game-frame {
            height: 70vh;
        }
    }
</style>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            🎮 <span>NovaPlay</span>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="../index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="game-page">
        <a href="../index.html" class="back-link">← Back to Home</a>
        <h1>Space Shooter</h1>
        <iframe class="game-frame" src="space-shooter/index.html" title="Space Shooter Game"></iframe>
    </div>
</body>
</html>
